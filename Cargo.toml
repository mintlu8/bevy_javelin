[package]
name = "bevy_javelin"
version = "0.1.0"
edition = "2024"

[workspace]
members = [ "asset_util", "texture" ]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["bevy_pbr", "bevy_sprite"]}
bevy_asset_util = { version = "0.1", path = "./asset_util" }
fastrand = "2.3.0"


[dev-dependencies]
bevy = { version = "0.19.0" }
bevy_texture_gen = { path = "./texture" }
ramp_gen = "0.1.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
